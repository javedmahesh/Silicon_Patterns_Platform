# Render Blueprint — deploys the FastAPI backend as a Docker web service.
# Render dashboard: New → Blueprint → point at this repo. Fill the secret env vars
# (sync:false → Render prompts for them and never stores them in git).
#
# Run the DB migrations once before/after first deploy (the app does NOT auto-run DDL
# at boot — safe with multiple replicas):
#   DATABASE_URL=... python scripts/apply_migrations.py
#
# The in-process Standard Run scheduler needs an always-on instance — Render's FREE
# plan sleeps on idle, so scheduled runs won't fire there. Use a paid instance (or a
# separate always-on worker) if you rely on the scheduler; else keep it disabled below.
services:
  - type: web
    name: silicon-patterns-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter          # 'free' sleeps on idle → the scheduler won't fire reliably
    healthCheckPath: /health
    envVars:
      # --- database ---
      - key: DATABASE_URL              # postgresql+psycopg://...  (Supabase session pooler)
        sync: false
      # --- deployment mode (fail-closed auth) ---
      - key: ENVIRONMENT               # "production" → no dev bypass; strict startup checks
        value: production
      # --- authentication: Microsoft Entra ID (Azure AD) ---
      - key: SP_JWT_SECRET             # signs this app's own session JWTs; 32+ random chars
        sync: false
      - key: MICROSOFT_TENANT_ID
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET   # accepted; not required by the local-JWKS verify flow
        sync: false
      - key: SP_BOOTSTRAP_ADMIN_EMAIL  # auto-provisioned super_admin on its first sign-in
        sync: false
      - key: SP_ADMIN_EMAILS           # comma-separated; auto-approved as admin on first login
        sync: false
      # --- API gate + CORS ---
      - key: SP_API_KEY                # strong key; clients send it as X-API-Key
        sync: false
      - key: CORS_ORIGINS              # JSON list, e.g. ["https://your-frontend.vercel.app"]
        sync: false
      - key: SP_RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: ANALYTICS_CACHE_SECONDS   # analytics Cache-Control max-age (seconds)
        value: "300"
      # --- Standard Run scheduler + Outlook notifications ---
      - key: SP_SCHEDULER_ENABLED      # "true" only on an always-on instance
        value: "false"
      - key: SP_SCHEDULE_TIMES         # HH:MM,HH:MM
        value: "09:00,21:00"
      - key: SP_NOTIFY_MODE            # auto | graph | log | off
        value: "auto"
      - key: SP_NOTIFY_SENDER_EMAIL    # licensed mailbox for Graph sendMail (if notifying)
        sync: false
      # --- Decision Maker Intelligence (Apify) ---
      - key: APIFY_API_TOKEN
        sync: false
      # --- Machine Learning (defaults fine; embeddings use the zero-dep fallback) ---
      - key: SP_ML_ENABLED
        value: "true"
